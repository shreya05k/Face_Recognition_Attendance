<!DOCTYPE html>
<html>

<head>
    <title>Attendance Records</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>Attendance Records</h1>

        <table>

            <tr>
                <th>ID</th>
                <th>Student ID</th>
                <th>Name</th>
                <th>Date</th>
                <th>Time</th>
                <th>Status</th>
            </tr>

            {% for record in records %}

            <tr>
                <td>{{ record[0] }}</td>
                <td>{{ record[1] }}</td>
                <td>{{ record[2] }}</td>
                <td>{{ record[3] }}</td>
                <td>{{ record[4] }}</td>
                <td>{{ record[5] }}</td>
            </tr>

            {% endfor %}

        </table>

        <br>

        <a href="/">
            <button>Back to Home</button>
        </a>

    </div>

</body>

</html>
